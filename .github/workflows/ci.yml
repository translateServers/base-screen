name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-m0:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        node: ['22.23.2', '24.18.1']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: corepack enable pnpm
      - run: corepack install --global pnpm@11.18.0
      - name: Resolve pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Restore pnpm and Turbo caches
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.pnpm-store.outputs.path }}
            .turbo
          key: ${{ runner.os }}-node-${{ matrix.node }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-node-${{ matrix.node }}-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-node-${{ matrix.node }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:m0
      - name: Ensure API report changes have Changesets
        env:
          BASE_SCREEN_API_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: pnpm check:api-changesets
      - name: Ensure verification leaves tracked files unchanged
        run: git diff --exit-code

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" role="img" aria-label="Base Screen：轻量、可嵌入、跨框架的大屏设计器基座">
  <defs>
    <linearGradient id="bsb-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F7DFF"/>
      <stop offset="1" stop-color="#22C9EE"/>
    </linearGradient>
    <linearGradient id="bsb-bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="bsb-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4F7DFF"/>
      <stop offset="1" stop-color="#22C9EE"/>
    </linearGradient>
    <radialGradient id="bsb-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4F7DFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#4F7DFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="bsb-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.045"/>
    </pattern>
  </defs>

  <rect width="1200" height="260" rx="28" fill="#0B1220"/>
  <rect width="1200" height="260" rx="28" fill="url(#bsb-grid)"/>
  <ellipse cx="180" cy="60" rx="260" ry="160" fill="url(#bsb-glow)"/>
  <ellipse cx="1050" cy="220" rx="280" ry="150" fill="url(#bsb-glow)"/>

  <!-- 品牌标记：画布 + 选中框 + 柱状图 -->
  <g transform="translate(52,50) scale(0.625)">
    <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bsb-tile)"/>
    <g fill="none" stroke="#FFFFFF" stroke-width="9" stroke-opacity="0.5">
      <rect x="56" y="56" width="144" height="144" rx="24"/>
    </g>
    <g fill="#FFFFFF">
      <rect x="46" y="46" width="20" height="20" rx="6"/>
      <rect x="190" y="46" width="20" height="20" rx="6"/>
      <rect x="46" y="190" width="20" height="20" rx="6"/>
      <rect x="190" y="190" width="20" height="20" rx="6"/>
    </g>
    <g fill="url(#bsb-bar)">
      <rect x="84" y="124" width="20" height="48" rx="10"/>
      <rect x="118" y="96" width="20" height="76" rx="10"/>
      <rect x="152" y="112" width="20" height="60" rx="10"/>
    </g>
  </g>

  <text x="268" y="122" font-family="system-ui, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="74" font-weight="700" letter-spacing="1" fill="#F8FAFC">Base Screen</text>
  <text x="272" y="172" font-family="system-ui, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="27" fill="#8FA3BF">轻量、可嵌入、跨框架的大屏设计器基座</text>
  <rect x="272" y="198" width="228" height="6" rx="3" fill="url(#bsb-accent)"/>

  <!-- 右侧装饰：抽象大屏面板 -->
  <g>
    <rect x="944" y="58" width="204" height="144" rx="18" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.09"/>
    <rect x="968" y="110" width="18" height="64" rx="9" fill="#22C9EE" fill-opacity="0.55"/>
    <rect x="998" y="86" width="18" height="88" rx="9" fill="#22C9EE" fill-opacity="0.75"/>
    <rect x="1028" y="126" width="18" height="48" rx="9" fill="#22C9EE" fill-opacity="0.45"/>
    <rect x="1064" y="84" width="60" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.18"/>
    <rect x="1064" y="106" width="44" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.12"/>
    <rect x="1064" y="128" width="52" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.12"/>
  </g>
</svg>

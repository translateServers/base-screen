<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Base Screen 专项案例</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b1016;
        --panel: #0e1620;
        --border: #2b3a4e;
        --text: #d7e2f0;
        --text-strong: #eef4fb;
        --muted: #9fb1c9;
        --accent: #39c5bb;
        --accent-soft: rgb(57 197 187 / 12%);
        --success: #86c99a;
        --radius: 10px;
        --font: 15px/1.55 system-ui, "Segoe UI", sans-serif;
        --mono: 12px/1.5 ui-monospace, "SFMono-Regular", Consolas, monospace;
      }

      html {
        scrollbar-gutter: stable;
      }

      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
        background: var(--bg);
      }

      body {
        box-sizing: border-box;
        padding: 36px 24px 64px;
        color: var(--text);
        font: var(--font);
        -webkit-font-smoothing: antialiased;
      }

      main {
        max-width: 1080px;
        margin: 0 auto;
        display: grid;
        gap: 24px;
      }

      h1,
      h2,
      p {
        margin: 0;
      }

      .hero {
        display: grid;
        gap: 8px;
      }

      .eyebrow {
        color: var(--accent);
        font: var(--mono);
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        color: var(--text-strong);
        font-size: 30px;
        letter-spacing: -0.01em;
      }

      .lede {
        max-width: 64ch;
        color: var(--muted);
      }

      .lede a {
        color: var(--text);
        text-decoration-color: var(--border);
        text-underline-offset: 3px;
      }

      .lede a:hover {
        color: var(--accent);
        text-decoration-color: var(--accent);
      }

      .toolbar {
        position: sticky;
        top: 0;
        z-index: 5;
        display: grid;
        gap: 10px;
        padding: 14px 0;
        background: var(--bg);
        border-bottom: 1px solid var(--border);
      }

      .search {
        box-sizing: border-box;
        width: 100%;
        padding: 11px 14px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--panel);
        color: var(--text);
        font: inherit;
      }

      .search::placeholder {
        color: var(--muted);
      }

      .search:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
        border-color: var(--accent);
      }

      .chips {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
      }

      .chip {
        padding: 4px 12px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: transparent;
        color: var(--muted);
        font: inherit;
        font-size: 13px;
        cursor: pointer;
        transition:
          border-color 160ms ease,
          color 160ms ease,
          background-color 160ms ease;
      }

      .chip:hover {
        border-color: var(--accent);
        color: var(--text);
      }

      .chip[aria-pressed="true"] {
        border-color: var(--accent);
        background: var(--accent-soft);
        color: var(--text-strong);
      }

      .chip:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }

      .chip-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
      }

      .chip-label {
        flex: none;
        color: var(--muted);
        font-size: 12px;
      }

      .toolbar-meta {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
      }

      .count,
      .hint {
        color: var(--muted);
        font: var(--mono);
      }

      .hint kbd {
        padding: 1px 5px;
        border: 1px solid var(--border);
        border-radius: 4px;
        background: var(--panel);
        color: var(--text);
        font: inherit;
      }

      .section {
        display: grid;
        gap: 14px;
      }

      .section-head {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
      }

      h2 {
        color: var(--text-strong);
        font-size: 18px;
      }

      .verify-note {
        color: var(--muted);
        font: var(--mono);
      }

      .verify-note[hidden] {
        display: none;
      }

      .verify-note code,
      code {
        color: var(--success);
        font: var(--mono);
      }

      .cards,
      .cases {
        display: grid;
        gap: 12px;
        grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      }

      .baseline-cards {
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      }

      .card {
        display: flex;
        flex-direction: column;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--panel);
        overflow: hidden;
        transition:
          border-color 160ms ease,
          box-shadow 160ms ease;
      }

      .card:hover {
        border-color: var(--accent);
        box-shadow: 0 10px 28px rgb(0 0 0 / 34%);
      }

      .card-main {
        display: grid;
        gap: 6px;
        padding: 15px 16px 12px;
        color: inherit;
        text-decoration: none;
      }

      .card-main:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: -2px;
      }

      .card-title {
        color: var(--text-strong);
        font-size: 16px;
      }

      .card-summary,
      .card-look {
        color: var(--muted);
        font-size: 13px;
      }

      .card-look b {
        color: var(--text);
        font-weight: 600;
      }

      .card-foot {
        display: grid;
        gap: 8px;
        margin-top: auto;
        padding: 0 16px 15px;
      }

      .packages {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .pkg {
        padding: 2px 8px;
        border-radius: 999px;
        background: var(--accent-soft);
        color: var(--accent);
        font: var(--mono);
      }

      .commands {
        display: grid;
        gap: 6px;
      }

      .card-command {
        display: flex;
        align-items: baseline;
        gap: 6px;
        min-width: 0;
      }

      .cmd-label {
        flex: none;
        color: var(--muted);
        font-size: 11px;
      }

      .card-command code {
        min-width: 0;
        overflow-wrap: anywhere;
        color: var(--success);
      }

      .copy {
        display: inline-flex;
        flex: none;
        align-items: center;
        justify-content: center;
        width: 24px;
        height: 24px;
        padding: 0;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        transition:
          border-color 160ms ease,
          color 160ms ease;
      }

      .copy:hover {
        border-color: var(--accent);
        color: var(--accent);
      }

      .copy:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }

      .copy[data-copied="true"] {
        border-color: var(--success);
        color: var(--success);
      }

      .empty {
        display: grid;
        gap: 12px;
        justify-items: start;
        padding: 24px;
        border: 1px dashed var(--border);
        border-radius: var(--radius);
        color: var(--muted);
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
        border: 0;
      }

      @media (width <= 640px) {
        body {
          padding: 24px 16px 48px;
        }

        .cards,
        .cases,
        .baseline-cards {
          grid-template-columns: minmax(0, 1fr);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header class="hero">
        <p class="eyebrow">Base Screen · browser-harness</p>
        <h1>专项案例</h1>
        <p class="lede">
          改完功能先来这里挑场景，再进对应案例。默认
          <a href="./">/</a>
          与
          <a href="./?designer">/?designer</a>
          仍是 Playwright 验收路径，不会出现本目录。
        </p>
      </header>

      <section class="toolbar">
        <input
          class="search"
          type="search"
          data-nav-search
          placeholder="搜索案例 / 包 / 关键词…"
          aria-label="搜索专项案例"
          autocomplete="off"
        />
        <div class="chip-row">
          <span class="chip-label">改动面</span>
          <nav class="chips" data-nav-packages aria-label="按改动面包筛选"></nav>
        </div>
        <div class="toolbar-meta">
          <p class="count" data-nav-count aria-live="polite"></p>
          <p class="hint">
            <kbd>/</kbd> 搜索 · <kbd>Esc</kbd> 清除 · <kbd>Enter</kbd> 打开首条
          </p>
        </div>
      </section>

      <section class="section">
        <h2>验收入口</h2>
        <nav class="cards baseline-cards" data-nav-baselines></nav>
      </section>

      <section class="section">
        <div class="section-head">
          <h2>Designer 装配体</h2>
          <p class="verify-note" data-nav-verify hidden></p>
        </div>
        <div class="cases" data-nav-list></div>
      </section>

      <p class="sr-only" role="status" data-copy-status aria-live="polite"></p>
    </main>
    <script type="module" src="/cases.ts"></script>
  </body>
</html>

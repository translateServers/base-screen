<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Base Screen Browser Harness</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        background: #0b1016;
      }

      body {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 420px;
        gap: 16px;
        padding: 16px;
        box-sizing: border-box;
      }

      base-screen-designer,
      base-screen-viewer {
        min-width: 0;
        min-height: 0;
        height: calc(100vh - 32px);
      }

      @media (max-width: 800px) {
        body {
          display: block;
          overflow: auto;
        }

        base-screen-designer,
        base-screen-viewer {
          display: block;
          width: 100%;
          min-height: 520px;
          height: 70vh;
          margin-bottom: 16px;
        }
      }
    </style>
  </head>
  <body>
    <base-screen-designer></base-screen-designer>
    <base-screen-viewer></base-screen-viewer>
    <script type="module" src="/main.ts"></script>
  </body>
</html>

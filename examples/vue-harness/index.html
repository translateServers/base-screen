<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Base Screen Vue 桥接专场测试</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        background: #0b1016;
        color: #e9f2ff;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          'PingFang SC',
          'Microsoft YaHei',
          sans-serif;
      }

      body {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
        gap: 12px;
        padding: 12px;
        box-sizing: border-box;
      }

      header {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }

      h1 {
        font-size: 16px;
        margin: 0;
      }

      header button {
        background: #1d2a3a;
        color: #e9f2ff;
        border: 1px solid #33465c;
        border-radius: 4px;
        padding: 4px 10px;
        cursor: pointer;
        font-size: 12px;
      }

      header button:hover {
        background: #24354a;
      }

      main {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 380px;
        gap: 12px;
        min-height: 0;
      }

      .stage {
        display: grid;
        /* 验证视口固定为 1440×900；确定两行尺寸，避免子内容反向参与父网格计算。 */
        grid-template-rows: 400px 400px;
        gap: 12px;
        min-height: 0;
      }

      base-screen-designer {
        min-width: 0;
        min-height: 0;
        height: 100%;
        overflow: auto;
      }

      base-screen-viewer {
        min-width: 0;
        min-height: 0;
        height: 100%;
        overflow: auto;
      }

      aside {
        background: #101826;
        border: 1px solid #223246;
        border-radius: 8px;
        padding: 12px;
        overflow: auto;
        min-height: 0;
      }

      aside h2 {
        font-size: 13px;
        margin: 0 0 8px;
        color: #9fb1c9;
      }

      .diagnostic-row {
        display: grid;
        grid-template-columns: 130px 1fr auto;
        gap: 4px 8px;
        font-size: 12px;
        line-height: 1.6;
        padding: 6px 0;
        border-bottom: 1px dashed #223246;
      }

      .diagnostic-row:last-child {
        border-bottom: none;
      }

      .diagnostic-key {
        color: #9fb1c9;
      }

      .diagnostic-ok {
        color: #39c5bb;
      }

      .diagnostic-fail {
        color: #ff6b6b;
      }

      #event-log {
        margin-top: 12px;
        font-family: ui-monospace, 'Cascadia Code', Consolas, monospace;
        font-size: 11px;
        white-space: pre-wrap;
        color: #9fb1c9;
        max-height: 200px;
        overflow: auto;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Base Screen · Vue 桥接专场测试</h1>
      <button type="button" data-action="rerender">重新渲染文档</button>
      <button type="button" data-action="toggle-hidden">隐藏 / 显示查看器</button>
      <button type="button" data-action="refresh">刷新诊断</button>
    </header>
    <main>
      <section class="stage">
        <base-screen-designer></base-screen-designer>
        <base-screen-viewer></base-screen-viewer>
      </section>
      <aside>
        <h2>物料渲染诊断（designer / viewer）</h2>
        <div data-diagnostics>（等待初始化…）</div>
        <h2>桥接事件日志</h2>
        <div id="event-log">（暂无事件）</div>
      </aside>
    </main>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
